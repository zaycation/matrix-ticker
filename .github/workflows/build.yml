name: Build Windows installer

on:
  push:
    tags: ["v*"]          # push a tag like v0.2.0 to publish a release with the installer
  workflow_dispatch:      # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Make icon
        run: python packaging/make_icon.py

      - name: Stamp version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -like "v*") { $v = $v.Substring(1) } else { $v = "dev" }
          Set-Content matrix/version.py "__version__ = `"$v`""

      - name: Build app (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed --name MatrixTicker
          --icon packaging/icon.ico
          --hidden-import pystray._win32
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          --hidden-import pynvml
          --collect-submodules winrt
          --collect-data tzdata
          --collect-data customtkinter
          gui.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -like "v*") { $v = $v.Substring(1) } else { $v = "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: MatrixTicker-Setup
          path: dist/MatrixTicker-Setup-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MatrixTicker-Setup-*.exe
          generate_release_notes: true
